name: DB

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: pnpm install --frozen-lockfile
      # Behavior tests (RLS, importers) run in ci.yml via `pnpm test`. This job only checks that the
      # migrations apply on a fresh stack and that the generated types match them.
      - run: supabase start -x realtime,imgproxy,studio,edge-runtime,logflare,vector,supavisor
        working-directory: packages/db
      - name: Generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code packages/db/src/database.types.ts
