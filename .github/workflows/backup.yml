name: Database backup

# A daily logical dump (schema and data) of the hosted database, kept as a workflow artifact.
# The repository is public and anyone signed in to GitHub can download its artifacts, so the dump is
# encrypted with BACKUP_PASSPHRASE before upload, and the job refuses to run without it.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the database URL and passphrase
        id: config
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::SUPABASE_DB_URL or BACKUP_PASSPHRASE is not set; skipping backup."
            # A manual run fails so a missing secret is obvious; the schedule just warns.
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then exit 1; fi
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the PostgreSQL 17 client
        if: steps.config.outputs.enabled
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      # The public schema only: the auth, storage and other Supabase-managed schemas are rebuilt
      # by Supabase itself, and the images in Storage are not in the database (the rows keep their
      # paths). The data file loads into a project whose migrations have been applied; the schema
      # file is a reference copy for the same purpose.
      # Nothing unencrypted is written to disk: each dump is compressed and encrypted (AES-256,
      # passphrase from the environment, never on the command line) in one pipe.
      - name: Dump and encrypt
        if: steps.config.outputs.enabled
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -o pipefail
          day="$(date -u +%Y-%m-%d)"
          encrypt() {
            gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback \
              --passphrase-fd 3 --output "$1" 3<<<"$BACKUP_PASSPHRASE"
          }
          pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --data-only \
            | gzip | encrypt "aaronisms-data-$day.sql.gz.gpg"
          pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges --schema-only \
            | sed '/^CREATE SCHEMA public;$/d' | gzip | encrypt "aaronisms-schema-$day.sql.gz.gpg"
          ls -lh aaronisms-*.sql.gz.gpg
      - uses: actions/upload-artifact@v4
        if: steps.config.outputs.enabled
        with:
          name: database-backup
          path: aaronisms-*.sql.gz.gpg
          retention-days: 30
          if-no-files-found: error
