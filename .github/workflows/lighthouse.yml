name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Runs on main finish, so every merge commit gets a result; only superseded PR runs are cancelled.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          write-env: 'true'
      - run: pnpm build
      # lighthouserc.cjs starts the built site, audits five pages three times each and fails
      # below 0.95 for performance, accessibility or best practices. The runner's Chrome is used.
      - run: pnpm lighthouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7
