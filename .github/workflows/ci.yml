name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      # Tests run against the real local Supabase stack (Docker); the vitest globalSetup reads its
      # credentials from `supabase status`.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start local Supabase
        working-directory: packages/db
        run: supabase start -x realtime,imgproxy,studio,edge-runtime,logflare,vector,supavisor
      # The migrations applied to a fresh stack; the committed types must match them.
      - name: Generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code packages/db/src/database.types.ts
      - run: pnpm turbo run lint typecheck test build

  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - name: Every PR carries a changeset
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
