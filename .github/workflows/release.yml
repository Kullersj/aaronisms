name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      # Applies pending changesets (bumps versions, writes CHANGELOGs) and commits straight to main.
      # Pushes made with GITHUB_TOKEN don't trigger workflows, so this commit doesn't re-run Release.
      - run: pnpm version-packages
      - name: Commit version bumps
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No pending changesets."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: version packages"
          git push origin HEAD:main
